version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Batch minor/patch bumps into one PR; major bumps stay separate so they
      # can be reviewed individually.
      go-dependencies:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Tracked deliberately via the floating `v1` tag, which is upstream's
      # recommended reference. The action ships patches near-daily, so letting
      # Dependabot pin it would mean an exact-version bump PR nearly every week
      # for no review value. Re-evaluate if we ever move to SHA pinning.
      - dependency-name: "anthropics/claude-code-action"
